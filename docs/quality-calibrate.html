<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VRM Motion Contact Calibration</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #edf1f8; background: #111722; font: 14px/1.55 system-ui, sans-serif; }
      main { height: 100vh; display: grid; grid-template-columns: minmax(300px, 360px) 1fr; }
      aside { padding: 20px; overflow: auto; background: #192231; border-right: 1px solid #2b384c; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { color: #bdc8d8; }
      label { display: block; margin: 14px 0 5px; color: #d9e0ec; }
      input, select, button { width: 100%; min-height: 38px; border: 1px solid #42516a; border-radius: 6px; padding: 8px 10px; color: inherit; background: #111722; }
      button { cursor: pointer; background: #385b91; border-color: #4a75b5; font-weight: 650; }
      button:disabled { opacity: .45; cursor: default; }
      #status { min-height: 54px; padding: 10px; margin: 14px 0; border-radius: 6px; background: #101721; color: #b9d5ff; white-space: pre-wrap; }
      #progress { color: #a8d9c0; }
      #viewport { min-width: 0; position: relative; }
      canvas { display: block; width: 100%; height: 100%; }
      #hint { position: absolute; left: 16px; bottom: 16px; padding: 9px 12px; border-radius: 6px; background: #101721dd; color: #e2e9f5; pointer-events: none; }
      @media (max-width: 750px) { main { grid-template-columns: 1fr; grid-template-rows: minmax(340px, 48vh) 1fr; } aside { grid-row: 2; } #viewport { grid-row: 1; } }
    </style>
    <script type="module" crossorigin src="/AnimeVRM/assets/quality_calibrate-Co6_kOJ1.js"></script>
    <link rel="modulepreload" crossorigin href="/AnimeVRM/assets/three-vrm.module-BSB1WpUY.js">
    <link rel="modulepreload" crossorigin href="/AnimeVRM/assets/OrbitControls-DUqRtP5w.js">
    <link rel="modulepreload" crossorigin href="/AnimeVRM/assets/validate-BXFD-vqW.js">
    <link rel="modulepreload" crossorigin href="/AnimeVRM/assets/path-C-vF2-aM.js">
  </head>
  <body>
    <main>
      <aside>
        <h1>VRM接触点の校正</h1>
        <p>対象VRMの表面をクリックして、顔・手のひら・胸の基準点を記録します。保存前にモデルを回転して位置を確認してください。</p>
        <label for="avatar">VRM URL</label>
        <input id="avatar" value="/models/aoi/aoi-school.vrm" />
        <button id="load">VRMを読み込む</button>
        <label for="target">次に記録する位置</label>
        <select id="target">
          <option value="leftCheek">左頬</option>
          <option value="rightCheek">右頬</option>
          <option value="mouth">口元</option>
          <option value="chin">顎</option>
          <option value="prayerCenter">胸の前の両手中心</option>
          <option value="leftPalm">左手のひら中心</option>
          <option value="rightPalm">右手のひら中心</option>
        </select>
        <label for="faceGap">顔との隙間（m）</label>
        <input id="faceGap" type="number" value="0.015" min="0" max="0.15" step="0.001" />
        <label for="palmGap">合わせた手の隙間（m）</label>
        <input id="palmGap" type="number" value="0.006" min="0" max="0.15" step="0.001" />
        <div id="status">読み込み待ちです。VRM URLを確認して「VRMを読み込む」を押してください。</div>
        <div id="progress"></div>
        <button id="save" disabled>校正済み contact-profile.json を保存</button>
        <p>各顔位置は顔表面をクリックします。両手中心は胸の少し前をクリックします。手のひらは掌側をクリックしてください。肘や指先をクリックしないでください。</p>
      </aside>
      <section id="viewport"><div id="hint">ドラッグ: 回転 / スクロール: 拡大縮小 / 選択位置をクリックして記録</div></section>
    </main>
  </body>
</html>
