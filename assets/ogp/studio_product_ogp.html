<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>AnimeVRM Studio Product OGP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #f8fafc;
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .canvas {
      width: 1200px;
      height: 630px;
      position: relative;
      background: #f8fafc;
      overflow: hidden;
    }

    /* Background Gradients & Subtle Grid */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(148, 163, 184, 0.10) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.10) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }
    .glow-blue {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.13) 0%, rgba(59, 130, 246, 0) 70%);
      top: -200px;
      right: 140px;
      pointer-events: none;
    }
    .glow-indigo {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.09) 0%, rgba(99, 102, 241, 0) 70%);
      bottom: -160px;
      right: -60px;
      pointer-events: none;
    }
    .glow-sky {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.08) 0%, rgba(14, 165, 233, 0) 70%);
      bottom: -100px;
      left: -80px;
      pointer-events: none;
    }

    /* Left Column: Focused, Clean Typography */
    .left-col {
      position: absolute;
      left: 64px;
      top: 58px;
      bottom: 58px;
      width: 520px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid rgba(226, 232, 240, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.10);
    }
    .brand-svg {
      width: 30px;
      height: 30px;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .headline-wrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 8px;
    }
    .main-heading {
      font-size: 44px;
      font-weight: 900;
      line-height: 1.22;
      color: #0f172a;
      letter-spacing: -0.03em;
    }
    .main-heading .gradient-text {
      background: linear-gradient(135deg, #2563eb 0%, #0284c7 50%, #0d9488 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub-copy {
      font-size: 17.5px;
      line-height: 1.62;
      color: #475569;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    /* Key Features: Large, clear badges without tiny text */
    .features-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }
    .feature-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 6px 13px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.03);
    }
    .feature-pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2563eb;
    }

    /* Bottom URL Info */
    .url-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #64748b;
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .url-icon {
      width: 17px;
      height: 17px;
      color: #94a3b8;
    }

    /* Right Showcase: Real Studio Workbench Window */
    .right-showcase {
      position: absolute;
      right: -36px;
      top: 48px;
      bottom: 48px;
      width: 660px;
      z-index: 10;
      display: flex;
      align-items: center;
    }

    .window-card {
      width: 100%;
      height: 534px;
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid rgba(203, 213, 225, 0.95);
      box-shadow: 
        0 24px 60px -12px rgba(15, 23, 42, 0.18),
        0 8px 24px -4px rgba(15, 23, 42, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .window-header {
      height: 38px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      padding: 0 16px;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .window-dots {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .dot-red { width: 11px; height: 11px; border-radius: 50%; background: #ef4444; }
    .dot-yellow { width: 11px; height: 11px; border-radius: 50%; background: #f59e0b; }
    .dot-green { width: 11px; height: 11px; border-radius: 50%; background: #10b981; }

    .window-title {
      font-size: 12.5px;
      font-weight: 700;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .window-badge {
      font-size: 11px;
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid rgba(37, 99, 235, 0.2);
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
    }

    .window-body {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #ffffff;
    }
    .app-screen {
      width: 108%;
      height: 112%;
      object-fit: cover;
      object-position: -160px -56px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="bg-grid"></div>
    <div class="glow-blue"></div>
    <div class="glow-indigo"></div>
    <div class="glow-sky"></div>

    <!-- Left Column: Product Info -->
    <div class="left-col">
      <div class="brand-row">
        <div class="brand-icon-box">
          <svg viewBox="0 0 36 36" fill="none" class="brand-svg">
            <defs>
              <linearGradient id="studio-brand-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#38bdf8" />
                <stop offset="45%" stop-color="#3b82f6" />
                <stop offset="100%" stop-color="#6366f1" />
              </linearGradient>
            </defs>
            <path
              d="M 8.5 27 L 17.2 6.8 C 17.6 5.8 18.4 5.8 18.8 6.8 L 27.2 24.8 C 27.8 26.2 26.8 27.6 25 27.6 C 23.8 27.6 22.8 26.6 22 25 L 19 19.5 L 13.5 19.5"
              stroke="url(#studio-brand-gradient)"
              stroke-width="4.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <span class="brand-title">AnimeVRM Studio</span>
      </div>

      <div class="headline-wrap">
        <h1 class="main-heading">
          ブラウザで創る、<br>
          <span class="gradient-text">3Dアニメ調会話劇</span>
        </h1>
        <p class="sub-copy">
          VRM演出・タイムライン編集・表情同期に対応した、<br>
          Webベースの3Dアニメ調会話劇スタジオ
        </p>

        <div class="features-row">
          <span class="feature-pill">
            <span class="feature-pill-dot"></span>
            3Dセルルック描画
          </span>
          <span class="feature-pill">
            <span class="feature-pill-dot"></span>
            タイムライン演出
          </span>
          <span class="feature-pill">
            <span class="feature-pill-dot"></span>
            表情＆カメラ同期
          </span>
        </div>
      </div>

      <div class="url-row">
        <svg class="url-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20"/>
        </svg>
        <span>uemegu.github.io/AnimeVRM/</span>
      </div>
    </div>

    <!-- Right Column: Studio App UI Window -->
    <div class="right-showcase">
      <div class="window-card">
        <div class="window-header">
          <div class="window-dots">
            <div class="dot-red"></div>
            <div class="dot-yellow"></div>
            <div class="dot-green"></div>
          </div>
          <div class="window-title">
            <span>AnimeVRM Studio</span>
            <span class="window-badge">Workbench</span>
          </div>
          <div style="width: 48px;"></div>
        </div>
        <div class="window-body">
          <img src="studio_app_screen.png" alt="AnimeVRM Studio App" class="app-screen">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
