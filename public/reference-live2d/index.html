<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ひと息 — Reference Live 2.5D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeebe7;color:#39333d;font-family:system-ui,sans-serif}main{display:grid;grid-template-columns:1fr 310px;height:100dvh}.stage{position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 36%,#f8f3ed,#d9d5df)}canvas{width:min(calc((100dvh - 40px)*0.75),100%);height:auto;max-height:96%;object-fit:contain}aside{padding:32px 26px;overflow:auto;background:#faf8f5;border-left:1px solid #d5ced8}small{letter-spacing:.2em;color:#887785}h1{font-size:30px;font-weight:500;margin:12px 0 6px}p{font-size:13px;line-height:1.8;color:#766977}label{display:flex;justify-content:space-between;margin:17px 0;font-size:13px;gap:8px}input{accent-color:#916581}button,select,a.download{display:block;width:100%;padding:11px;border:1px solid #d5cad2;border-radius:8px;background:#fff;color:inherit;text-align:center;text-decoration:none;font:inherit;font-size:13px;margin:10px 0;cursor:pointer}button.primary{background:#765d74;color:white;border:0}.status{position:absolute;bottom:20px;left:22px;font-size:11px;color:#706574}hr{border:0;border-top:1px solid #e1dbe0;margin:25px 0}output{font-variant-numeric:tabular-nums}.error{color:#a32c38}@media(max-width:700px){main{grid-template-columns:1fr;height:auto}.stage{height:75dvh}aside{border:0;padding:22px}canvas{max-height:100%}}
summary{cursor:pointer;padding:10px 0;font-size:14px}label{align-items:center}label select{width:auto;min-width:0;flex:1;margin:0 0 0 12px}</style><main><div class="stage"><canvas id="view" width="1086" height="1448" aria-label="頬杖の接触を保って動くキャラクター"></canvas><div class="status" id="status">素材を読み込み中…</div></div><aside><small>REFERENCE / LIVE 2.5D</small><h1>ひと息</h1><p>原画の表情に、ごく小さな動きを。<br>頬と手は同じ接触点でつながります。</p>
<button class="primary" id="pause">一時停止</button><button id="original">原画と比較</button><button id="neutral">ニュートラル姿勢</button>
<details><summary>基本の動き</summary><label>自動まばたき<input id="blink" type="checkbox" checked></label><label>微小な視線<input id="gaze" type="checkbox" checked></label><label>呼吸<input id="breath" type="checkbox" checked></label><label>頭部移動<input id="head" type="checkbox" checked></label><label>髪の物理揺れ<input id="hair" type="checkbox" checked></label><label>リボンの揺れ<input id="ribbon" type="checkbox" checked></label>
<label>頭の振幅 <output id="angleLabel">0.8°</output></label><input id="angle" aria-label="頭の振幅" style="width:100%" type="range" min="0" max="5" step="0.1" value="0.8"></details>
<hr><details open><summary>口とリップシンク</summary>
<label>母音<select id="vowel"><option value="rest">閉じ口</option><option value="aa">aa / あ</option><option value="ih">ih / い</option><option value="ou">ou / う</option><option value="ee">ee / え</option><option value="oh">oh / お</option></select></label>
<label>口の開き <output id="openingLabel">100%</output></label><input id="opening" aria-label="口の開き" style="width:100%" type="range" min="0" max="1" step="0.01" value="1">
<button id="lipDemo">連続発話デモ</button>
<label for="audioFile">音声ファイル</label><input id="audioFile" style="width:100%" type="file" accept="audio/*"><button id="audioPlay">音声を再生</button><button id="microphone">マイクで話す</button><p id="audioStatus" aria-live="polite">音声はこのブラウザ内で解析します。</p>
<p>50%で各母音の半開き。発話中は閉じ口を挟まず、母音間をつなぎます。</p></details>
<hr><label>頬染め・瞳の潤み <output id="blushLabel">0%</output></label><input id="blush" aria-label="頬染めと瞳の潤み" style="width:100%" type="range" min="0" max="1" step="0.01" value="0">
<button id="halfBlink">半目を確認</button>
<hr><label>表示<select id="mode"><option value="all">すべてのパーツ</option><option value="face">顔</option><option value="handwear">頬杖の手</option><option value="underpaint">隠れ部分の補完</option><option value="eye_close">閉じ目</option><option value="hair">髪</option><option value="ribbon">リボン</option></select></label>
<button id="close">まばたきを確認</button><a class="download" href="reference-expressions.psd" download>表情差分入りPSDを保存</a><p id="metrics">WebGLを準備中</p><p>推奨振幅 0.8°。上限 5°。<br>スペースキーで一時停止／再開。</p></aside></main><script type="module" src="preview.js?v=expressions-2"></script></html>
