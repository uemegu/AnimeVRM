<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教室の簡易3Dセット | AnimeVRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Kiwi+Maru:wght@400;500&family=Montserrat:wght@300;400;600;800;900&family=Shippori+Mincho:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #eef4fc; background: #b8c3d3; font: 14px/1.6 system-ui, sans-serif; }
    canvas { width: 100vw; height: 100vh; display: block; }
    header { position: fixed; top: 20px; left: 24px; padding: 15px 20px; border-radius: 12px; background: #182535df; max-width: calc(100vw - 48px); }
    h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
    p { margin: 0; color: #bbcbdc; font-size: 12px; }
    nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 12px; border-radius: 14px; background: #182535ed; width: max-content; max-width: calc(100vw - 24px); }
    button, a { border: 1px solid #ffffff26; border-radius: 7px; padding: 9px 14px; color: #e5eef8; background: #ffffff0d; cursor: pointer; text-decoration: none; font: inherit; }
    button:hover, a:hover { background: #ffffff22; }
    button[aria-pressed="true"] { background: #d0e5f3; color: #253d54; }
    button:disabled { opacity: 0.4; cursor: wait; }
    #shot { position: fixed; top: 24px; right: 24px; background: #182535dd; padding: 7px 15px; border-radius: 20px; }
    @media (max-width: 700px) { #shot { top: auto; bottom: 160px; } header { left: 12px; top: 12px; max-width: calc(100vw - 24px); } button, a { padding: 7px 9px; font-size: 12px; } }
  </style>
</head>
<body>
  <canvas aria-label="画像テクスチャで構成した教室とアオイ"></canvas>
  <header><h1>教室 / 簡易3Dセット</h1><p>床・壁・天井を面ごとの1枚絵、机を段ごとのアクスタで組んだ撮影用セット。</p><p id="status" role="status">教室を読み込み中…</p></header>
  <div id="shot">教室後方から</div>
  <nav aria-label="カメラと比較">
    <button data-shot="0" aria-pressed="true">教室後方から</button><button data-shot="1" aria-pressed="false">会話</button><button data-shot="2" aria-pressed="false">左から</button><button data-shot="3" aria-pressed="false">右から</button>
    <button id="avatar-toggle" disabled aria-pressed="false">アバターを隠す</button><button id="play">カメラを再生</button><a href="./scenarios/painted-classroom.html">シナリオで見る</a>
  </nav>
  <script type="module" src="/src/painted-classroom-preview.ts"></script>
</body>
</html>
